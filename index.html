<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productivity Dashboard</title>
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/todo.css" />
    <link rel="stylesheet" href="./css/notes.css" />
    <!-- <link rel="stylesheet" href="./css/responsive.css" /> -->
    <script type="module" src="./js/main.js"></script>
  </head>
  <body>
    <aside class="sidebar">
      <nav>
        <ul class="nav-wrap">
          <li data-section="dashboard">
            <a href="#">Dashboard</a>
          </li>
          <li data-section="todo">
            <a href="#">Todo</a>
          </li>
          <li data-section="notes">
            <a href="#">Notes</a>
          </li>
          <li data-section="timer">
            <a href="#">Timer</a>
          </li>
          <li data-section="weather">
            <a href="#">Weather</a>
          </li>
        </ul>
        <div class="nav-footer">
          <button
            id="theme-toggle"
            class="btn btn-ghost"
            aria-label="Toggle Theme"
          ></button>
        </div>
      </nav>
    </aside>
    <main class="main wrapper">
      <section class="page-section" data-section="dashboard">
        <h2>Dashboard</h2>
      </section>
      <section class="page-section" data-section="todo">
        <h2>Todo</h2>
        <div class="todo-toolbar">
          <form class="todo-form">
            <input
              type="text"
              name="todo-input"
              placeholder="What needs to be done ?"
              class="input"
              required
            />
            <input
              type="date"
              name="todo-date"
              class="input"
              placeholder="Due Date"
              required
            />
            <span class="select-wrap">
              <select class="input" name="todo-priority" required></select>
            </span>
            <button type="submit" class="btn btn-primary" name="add-todo">
              Add
            </button>
            <button type="reset" class="btn btn-secondary">Cancel</button>
          </form>
          <div class="bulk-actions card" data-role="bulk-actions">
            <div class="bulk-actions__meta">
              <label class="bulk-toggle">
                <input
                  type="checkbox"
                  class="checkbox"
                  data-action="bulk-toggle-all"
                />
              </label>

              <p class="bulk-actions__count" data-role="selected-count">
                0 Selected
              </p>
            </div>

            <div class="bulk-actions__list">
              <button
                type="button"
                class="toolbar-link"
                data-action="bulk-complete"
              >
                Mark as Completed
              </button>

              <button
                type="button"
                class="toolbar-link"
                data-action="bulk-incomplete"
              >
                Mark as Incomplete
              </button>

              <button
                type="button"
                class="toolbar-link"
                data-action="bulk-delete"
              >
                Delete Selected
              </button>
            </div>
          </div>
        </div>
        <section>
          <div class="todo-controls">
            <div class="tab-wrap" id="todo-filters">
              <div class="tab" tabindex="0" data-filter="all">All</div>
              <div class="tab" tabindex="0" data-filter="active">Active</div>
              <div class="tab" tabindex="0" data-filter="completed">
                Completed
              </div>
              <div class="tab" tabindex="0" data-filter="overdue">Overdue</div>
            </div>
            <div class="search-wrap" data-role="todo-search">
              <input
                type="text"
                class="input"
                placeholder="Search"
                data-action="todo-search-input"
              />
              <button
                type="button"
                class="search-clear btn btn-ghost btn-icon"
                data-action="todo-clear-search"
                aria-label="Clear search"
              >
                ✕
              </button>
            </div>
          </div>
          <div class="todo-list" data-role="todo-list"></div>
          <!-- place holder for now -->
          <div class="todo-footer"></div>
        </section>
      </section>
      <section class="page-section" data-section="notes">
        <div class="notes-wrap">
          <div class="notes-list">
            <div class="notes-header">
              <div>
                <h2>
                  Notes
                  <span class="notes-toolbar">
                    <button class="btn btn-ghost btn-icon" data-action="sort">
                      ⇅
                    </button>
                  </span>
                </h2>
                <p>Organize your thoughts and tasks</p>
              </div>
            </div>
            <div class="notes"></div>
          </div>
          <div class="notes-form-wrap">
            <form class="notes-form" data-action="new">
              <input
                type="text"
                name="notes-title"
                placeholder="Enter title"
                class="input"
                required
              />
              <textarea
                name="notes-desc"
                class="notes-desc input"
                placeholder="Enter description"
                class="input"
              ></textarea>
              <div class="action-wrap">
                <button
                  type="submit"
                  class="btn btn-primary"
                  data-role="save-note"
                >
                  Save
                </button>
                <button
                  type="reset"
                  class="btn btn-secondary"
                  data-role="cancel-note"
                >
                  Cancel
                </button>
              </div>
            </form>
          </div>
        </div>
      </section>
      <section class="page-section" data-section="timer">
        <h2>Timer</h2>
      </section>
      <section class="page-section" data-section="weather">
        <h2>Weather</h2>
      </section>
    </main>
  </body>
</html>
